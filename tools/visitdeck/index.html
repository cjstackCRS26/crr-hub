e, program, or capstone?"]},{n:7,s:"acad",sub:"FIRST YEAR & WORKLOAD",k:"q",qs:["How are freshman advisors assigned?","How would you describe the freshman experience?","How many hours of class is typical each week?","How many hours a day do students spend on homework?"]},{n:8,s:"acad",sub:"STUDY & LIBRARY RESOURCES",k:"q",qs:["Best places to study? Are there quiet spaces?","What are library hours \u2014 do they change at exams?","Is there access to other library collections?","Research methods or databases I should learn?","Do any majors require a thesis or senior project?"]},{n:9,s:"acad",sub:"ACADEMIC SUPPORT",k:"q",qs:["Is there free academic support or tutoring?","Is there a writing center, and how do I access it?","Do librarians help with research?","What learning-disability resources are offered?","How involved are academic advisors?"]},{n:10,s:"acad",sub:"RESEARCH OPPORTUNITIES",k:"q",qs:["What undergrad research opportunities exist?","How many students participate in research?","Are any departments known for their research?","How could I prepare for graduate-level research?"]},{n:11,s:"acad",sub:"INTERNSHIPS",k:"q",qs:["What internships are available, and how many get them?","Where have students interned?","Summer internship or research through the school?","Are there internship opportunities abroad?"]},{n:12,s:"acad",sub:"STUDY ABROAD",k:"q",qs:["Is study abroad available, and what % of students go?","Is it through the school or external programs?","Do certain majors find study abroad difficult?"]},{n:13,s:"ath",sub:"START HERE",k:"start",who:"the head coach and assistants \u2014 on calls, visits, and at camps",cue:"You're interviewing them as much as they're evaluating you. A scholarship offer isn't the finish line \u2014 fit is."},{n:14,s:"ath",sub:"THE COACH & THE PROGRAM",k:"q",qs:["What's your coaching philosophy and style of play?","What position/event/race do you see me in?","How many are you recruiting in my class and position?","How important is academics in your program's philosophy?"]},{n:15,s:"ath",sub:"TIME, TRAVEL & OFF-SEASON",k:"q",qs:["What's the weekly time commitment?","What does the off-season program look like?","How does the team travel to away competitions?"]},{n:16,s:"ath",sub:"ATHLETIC SCHOLARSHIPS & AID",k:"q",qs:["Do you offer full or partial athletic scholarships?","Can athletic aid combine with merit or academic aid?","What are the conditions for keeping a scholarship?","What happens to my scholarship if I get injured?","Is gear and equipment provided, or do athletes pay?"]},{n:17,s:"ath",sub:"ATHLETE ACADEMICS & PERKS",k:"q",qs:["How much class does an athlete miss, and how is it handled?","Do student-athletes have priority registration?","What academic support exists for student-athletes?"]},{n:18,s:"ath",sub:"FIT AROUND THE TEAM",k:"q",qs:["What's the campus attitude toward student-athletes?","What are professors' attitudes toward athletes?","Are there intramurals or exercise classes?","Is there a gym, and how late is it open?"]},{n:19,s:"life",sub:"START HERE",k:"start",who:"tour guides, current students, and your own eyes",cue:"You'll spend far more hours living here than competing. Picture a regular Tuesday \u2014 not just game day."},{n:20,s:"life",sub:"WHERE YOU'LL LIVE",k:"q",qs:["What dorm choices are there, and what are they like?","Are dorms clustered or spread out? Interest-based dorms?","Do most students live on campus? After sophomore year?","Are students ever placed in triples?"]},{n:21,s:"life",sub:"ROOMMATES & RES LIFE",k:"q",qs:["How are the resident counselors \u2014 do they plan events?","Do most students get along with random roommates?","What's the process for a conflict or room switch?","How are residence halls secured?","What's the Wi-Fi like \u2014 speed and quality?"]},{n:22,s:"life",sub:"DINING & DAILY LIFE",k:"q",qs:["What does the dining hall serve, and how is it really?","Does dining accommodate dietary restrictions?","Do most students go home on weekends?","What off-campus living options exist, and what's the cost?"]},{n:23,s:"life",sub:"CLUBS, ACTIVITIES & SERVICE",k:"q",qs:["What activities and clubs are most popular?","What community-service opportunities exist?","How do students volunteer in the surrounding community?","Are art or music spaces open to non-majors?"]},{n:24,s:"life",sub:"SOCIAL SCENE",k:"q",qs:["Where do students hang out, on and off campus?","How present is Greek life, and what % join?","What's the party scene like? (Ask students privately.)","What are the big campus events?","Are there theaters, venues, or good caf\xE9s nearby?"]},{n:25,s:"life",sub:"DIVERSITY & BELONGING",k:"q",qs:["How ethnically diverse is the campus?","How many international students, and from where?","What support exists for international students?","Is there a learning community or freshman experience?"]},{n:26,s:"life",sub:"GETTING AROUND & STAYING SAFE",k:"q",qs:["Can you get around \u2014 and off \u2014 campus without a car?","What transportation options are there?","Is it safe to walk at night? What measures are in place?","Are there late-night shuttles or safety programs?"]},{n:27,s:"life",sub:"WELLBEING & WORKING",k:"q",qs:["How accessible are student health services?","What mental-health and stress-management programs exist?","Are there social orientation programs for freshmen?","Do many students work part-time, and is it easy to?"]},{n:28,s:"adm",sub:"START HERE",k:"start",who:"admissions counselors and reps",cue:"A coach can want you and admissions can still say no. Get in on your own merit, too."},{n:29,s:"adm",sub:"WHO GETS IN",k:"q",qs:["What qualities and experiences do you look for?","Walk me through the application evaluation process.","How big a role do test scores play? AP for credit?","Is admission need-blind or need-aware?"]},{n:30,s:"adm",sub:"GETTING AN EDGE",k:"q",qs:["How many students are accepted through early admission?","Is family legacy considered?","Any advice \u2014 and does early vs. regular differ?","What's unique here, and why do students choose it?"]},{n:31,s:"adm",sub:"WILL I THRIVE HERE",k:"q",qs:["What are the college's most important values?","What kind of student succeeds here?","What kind of student might not be happy here?","What percentage of students graduate in four years?"]},{n:32,s:"adm",sub:"LIFE AFTER COLLEGE",k:"q",qs:["Can you share career placements or grad-school stats?","How do you prepare students for post-grad employment?","Is there an active, accessible alumni network?","How fast do grads find work in their field?","Are there networking or career fairs each year?"]},{n:33,s:"aid",sub:"START HERE",k:"start",who:"admissions, financial aid offices, and coaches (for athletic aid)",cue:"The \u201Cbest\u201D offer is the one your family can actually afford. Compare net cost, not sticker price."},{n:34,s:"aid",sub:"THE AID PACKAGE",k:"q",qs:["What's your average financial aid package?","What's the typical breakdown of loans vs. grants?","Do you meet 100% of demonstrated need?","Does aid usually change after freshman year?","What do you require besides the FAFSA?"]},{n:35,s:"aid",sub:"SCHOLARSHIPS & COST",k:"q",qs:["How many get merit scholarships, and the average award?","What need-based scholarships or grants, and to what %?","Other scholarships to apply for at application time?","How much do students typically owe at graduation?","Is there work-study, and is it easy to land a job?"]},{n:36,s:"prof",sub:"START HERE",k:"start",who:"a professor or advisor in your intended major",cue:"These conversations reveal whether the program \u2014 not just the school \u2014 is right for you."},{n:37,s:"prof",sub:"YOUR CLASS",k:"q",qs:["What are your expectations for students in your class?","How can students succeed here?","Typical requirements \u2014 exams, papers, presentations?","What materials and prerequisites do you expect?"]},{n:38,s:"prof",sub:"THE PROGRAM",k:"q",qs:["What are the strengths of your program and department?","What's the community of majors like?","How often do you mentor students outside class?","What outside-classroom opportunities reinforce learning?"]},{n:39,s:"prof",sub:"GROWING IN THE MAJOR",k:"q",qs:["What research opportunities do you offer?","How could I prepare for graduate-level research?","Could I write a thesis or do a capstone?","How much flexibility to shape my major?"]},{n:40,s:"stu",sub:"START HERE",k:"start",who:"current students and tour guides \u2014 ideally away from staff",cue:"Brochures sell. Students tell. This is where you get the unfiltered truth."},{n:41,s:"stu",sub:"THEIR REAL EXPERIENCE",k:"q",qs:["Why did you choose this college?","Favorite and least favorite things about being here?","What surprised you about campus life?","What's a typical weekday like for you?","Favorite spot you've discovered on campus?"]},{n:42,s:"stu",sub:"THE HONEST TRUTH",k:"q",qs:["How accessible are professors, really?","How hard do you work for good grades?","How easy is it to get around campus?","What do you honestly think of the dining hall food?","Anything you'd change about the school?"]},{n:43,s:"stu",sub:"ADVICE FOR ME",k:"q",qs:["What do you wish you'd known going into freshman year?","What do you wish you'd asked on a tour?","Anything you'd do differently?","Your most important advice for freshmen?"]},{n:44,s:"stu",sub:"THEIR PATH",k:"q",qs:["What's it like to study in your major?","What's your favorite class, and why?","How helpful was your freshman-year advisor?"]},{n:45,s:"mirror",sub:"START HERE",k:"start",who:"yourself \u2014 after every visit, before you decide",cue:"The numbers matter, but so does your gut. Pull these the night after a visit, while it's fresh."},{n:46,s:"mirror",sub:"HOW IT FELT",k:"q",qs:["How did you really feel when you were on campus?","How did staff interact with students \u2014 warm or distant?","Did students make you feel at home?","Could you picture yourself in class \u2014 or a dorm \u2014 with them?"]},{n:47,s:"mirror",sub:"DOES IT FIT YOU",
