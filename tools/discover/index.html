        .crs-root {

          color: ${Dr};
          min-height: 100vh;

          background: ${Mn};
          color: #fff;
          padding: 14px 20px 12px;

        }
        .crs-bar-top {
          display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
        }
        .crs-mark {
          font-size: 12px; letter-spacing: 0.06em; font-weight: 600; color: ${Is};
        }
        .crs-level { font-size: 12px; color: #A9B8CE; }
        .crs-rail { display: flex; gap: 3px; margin-top: 11px; }

        .crs-wrap { max-width: 720px; margin: 0 auto; padding: 26px 20px 0; }

        .crs-sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .crs-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .crs-kicker { font-size: 13px; color: ${me}; font-weight: 500; }

        .crs-h1 {
          font-family: 'IBM Plex Serif', Georgia, serif;
          font-size: 30px; line-height: 1.2; font-weight: 600;
          margin: 0 0 14px; letter-spacing: -0.01em;
        }
        .crs-h2 {
          font-family: 'IBM Plex Serif', Georgia, serif;
          font-size: 23px; line-height: 1.25; font-weight: 600;
          margin: 0 0 8px; letter-spacing: -0.01em;
        }
        .crs-h3 {
          font-size: 15px; font-weight: 600; margin: 26px 0 10px; color: ${Mn};
        }
        .crs-lead {
          font-family: 'IBM Plex Serif', Georgia, serif;
          font-size: 16px; line-height: 1.6; color: #33455F; margin: 0 0 18px;

        .crs-note { font-size: 13.5px; line-height: 1.55; color: ${me}; margin: 0 0 14px; max-width: 62ch; }

        .crs-rated {

          padding: 13px 14px 11px; margin-bottom: 8px;
        }
        .crs-rated-q { font-size: 14.5px; line-height: 1.4; margin: 0 0 10px; font-weight: 500; }

        }
        .crs-scale-btn:focus-visible { outline: 2px solid ${q}; outline-offset: 2px; }

        }
        .crs-chip:focus-visible { outline: 2px solid ${q}; outline-offset: 2px; }

        .crs-counter { font-size: 13px; margin: 10px 0 0; font-weight: 500; }

        .crs-field { margin-bottom: 16px; }
        .crs-label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
        .crs-input, .crs-select, .crs-text {
          width: 100%; font-family: inherit; font-size: 15px;
          padding: 10px 12px; border: 1px solid ${he}; border-radius: 3px;
          background: #fff; color: ${Dr};
        }
        .crs-input:focus, .crs-select:focus, .crs-text:focus {
          outline: 2px solid ${q}; outline-offset: 0; border-color: ${q};
        }
        .crs-text { min-height: 84px; resize: vertical; line-height: 1.5; }

        .crs-cat {

          margin: 22px 0 8px; padding-bottom: 5px; border-bottom: 1px solid ${he};
        }

        .crs-tri { display: flex; gap: 5px; }
        .crs-tri-btn {
          flex: 1; font-family: inherit; font-size: 12px; padding: 7px 3px;
          border: 1px solid ${he}; border-radius: 2px; background: #fff;
          color: ${me}; cursor: pointer;
        }
        .crs-tri-btn:focus-visible { outline: 2px solid ${q}; outline-offset: 2px; }

        .crs-foot {
