l",also:"Goal Stack Planner \xB7 goals and weekly habits (Steps 3\u20134)",ms:[["CRR-L2-S03-M1","Complete your strengths inventory"],["CRR-L2-S03-M2","Write your why and build your goal pyramid"],["CRR-L2-S03-M3","Save your identity statement"]],acts:["Complete the Student-Athlete Discover Assessment.","Ask your career advisor and one other adult to name your strengths.","Write your why in one or two sentences.","Build your goal pyramid.","Save your identity statement in your Tracker."],reflect:"What drives you to compete?"},{n:4,level:2,title:"Commit to the Process",smart:"Motivated",tool:"goalstack",purpose:"Turn your purpose into daily habits in four areas of your life.",why:"Recruiting takes years. The routines you build now hold up when your season, schoolwork and recruiting all get busy at once.",learn:["Lesson 4","Commitment Tool Kit"],lesson:"lessons/lesson4/index.html",also:"Wheel of Recruiting Success \xB7 retake",ms:[["CRR-L2-S04-M1","Retake the Wheel and compare it with your Baseline","wheel"],["CRR-L2-S04-M2","Set one habit for each of the four commitments"],["CRR-L2-S04-M3","Track your habits for four weeks"]],acts:["Rate your habits on the Wheel of Recruiting Success.","Choose one daily habit for each commitment.","Block time for each habit in your weekly schedule.","Check off your habits every day for four weeks.","Review your progress with a coach or counselor."],reflect:"Which commitment needs the most work right now?"},{n:5,level:3,title:"Understand the Power of Academics",smart:"Strategic",tool:"academic",purpose:"Grades decide where you can go, whether you can compete and what aid you can earn.",why:"Academics are the part of recruiting you control most. A strong transcript keeps every level open, including options you have not considered yet.",learn:["Lesson 5","Academic Edge Tool Kit"],also:"",ms:[["CRR-L3-S05-M1","Calculate your core-course GPA"],["CRR-L3-S05-M2","Put a four-year plan on file"],["CRR-L3-S05-M3","Set an academic goal for this semester"]],acts:["Find your school\u2019s approved core course list.","Calculate your core-course GPA with your counselor.","Compare your courses with each level\u2019s rules.","Map your courses to your future goals.","Set one academic goal in your Tracker."],reflect:"Which course will move you toward your future?"},{n:6,level:3,title:"Find Your Best Fit",smart:"Targeted",tool:"fit",purpose:"Judge every college through four lenses, in this order.",why:"The right fit matters more than the biggest name. Students who choose a school that fits all four ways are more likely to thrive there.",learn:["Lesson 6","College Fit Tool Kit"],also:"O.W.N. Your Next \xB7 College Fit Edition",ms:[["CRR-L3-S06-M1","Score three colleges through the four lenses"],["CRR-L3-S06-M2","Get an honest evaluation from your coach"],["CRR-L3-S06-M3","Build your first target list"]],acts:["Score three colleges in the College Fit Tool.","Ask your coach for an honest evaluation of your level.","Run the net price calculator on each college\u2019s website.","Tour a campus, in person or online.","Add your initial target list to your Tracker."],reflect:"Which lens matters most to you, and why?"},{n:7,level:4,title:"Be Recruitable",smart:"Strategic",tool:"ownid",purpose:"See yourself the way college coaches do, in four areas you can improve.",why:"Knowing where you stand in all four areas now gives you time to improve before junior year, when most recruiting conversations begin.",learn:["Lesson 7","Coach's Eye Tool Kit"],also:"Wheel of Recruiting Success \xB7 retake",ms:[["CRR-L4-S07-M1","Rate yourself and compare with your coach"],["CRR-L4-S07-M2","Set a development goal in each area"],["CRR-L4-S07-M3","Register with the NCAA or NAIA, if needed"]],acts:["Rate yourself in all four areas.","Ask your coach to rate you the same way.","Discuss the biggest gap with your coach.","Register with the NCAA or NAIA Eligibility Center, if needed.","Set one development goal per area in your Tracker."],reflect:"Which area will you work on first?"},{n:8,level:4,title:"Build Your Brand",smart:"Authentic",tool:"ownid",purpose:"Your brand is your story, told the same way everywhere. Start with who you are and what matters to you, then build five assets that show it.",why:"Coaches meet you through your portfolio long before they meet you in person. A clear, honest portfolio earns a closer look.",learn:["Lesson 8","Brand Builder Tool Kit"],also:"",ms:[["CRR-L4-S08-M1","Complete your O.W.N. ID Profile, intro letter and video"],["CRR-L4-S08-M2","Audit your social media"],["CRR-L4-S08-M3","Practice your 30-second pitch"]],acts:["Write three words that describe who you are.","Make your recruiting profiles match your brand.","Draft your intro letter in your own words.","Film your highlight video with your coach\u2019s input.","Audit your social media and practice your pitch."],reflect:"What do you want coaches to know about you?"},{n:9,level:5,title:"Share Your Story",smart:"Motivated",tool:"lab",purpose:"Tell your story to college coaches, in writing and out loud, through five channels.",why:"Coaches recruit students who reach out, respond and follow up. How you communicate shows your maturity long before you visit campus.",learn:["Lesson 9","Coach Connect Tool Kit"],also:"Coach Communication Log",ms:[["CRR-L5-S09-M1","Complete questionnaires for your target list"],["CRR-L5-S09-M2","Email three coaches"],["CRR-L5-S09-M3","Log every contact and reply"]],acts:["Complete the questionnaire for each school on your list.","Email three coaches, each message written for that program.","Practice a coach phone call with your counselor or coach.","Update your recruiting profile and social media.","Log every contact and reply in your Tracker."],reflect:"What will you say in your first message to a coach?"},{n:10,level:5,title:"Be Seen",smart:"Motivated",tool:"events",purpose:"Coaches can only recruit students they know about. Get seen, and be ready when it counts.",why:"Many athletes are identified but never recruited. Energy, a plan and your best effort help you move further down the funnel.",learn:["Lesson 10","Exposure Tool Kit"],also:"",ms:[["CRR-L5-S10-M1","Choose events where your target schools recruit"],["CRR-L5-S10-M2","Email coaches before each event"],["CRR-L5-S10-M3","Follow up after every event"]],acts:["Choose events where your target schools recruit.","Email those coaches your schedule before each event.","Ask your coach to contact programs for you.","Follow up with every coach after an event.","Track where each school is in your funnel."],reflect:"Where are your target schools in your funnel today?"},{n:11,level:5,title:"Visit Campus",smart:"Authentic",tool:null,purpose:"Test your fit in person. Prepare, ask good questions and picture yourself there.",why:"A visit shows you what a website cannot. Scoring every visit the same way lets you compare schools fairly when it is time to decide.",learn:["Lesson 11","Campus Visit Tool Kit"],also:"Campus Visit Scorecard (coming to this app)",ms:[["CRR-L5-S11-M1","Prepare your questions"],["CRR-L5-S11-M2","Score every visit the same day"],["CRR-L5-S11-M3","Send a thank-you within two days"]],acts:["Research the program and write your questions.","Confirm your visit with the coach by email.","Attend a class, a practice and a meal if you can.","Score your visit the same day.","Thank the coach by email within two days."],reflect:"Could you see yourself on this campus? Why?"},{n:12,level:6,title:"Weigh Your Options & Select Best Fit",smart:"Targeted",tool:"decision",purpose:"Choose by fit, cost and purpose. Then commit with confidence.",why:"This is the decision your whole journey builds toward. Choosing by fit, cost and purpose leads to four good years, on the team or off it.",learn:["Lesson 12","Decision Making Tool Kit"],also:"",ms:[["CRR-L6-S12-M1","Complete the FAFSA"],["CRR-L6-S12-M2","Compare the net cost of every offer"],["CRR-L6-S12-M3","Make your decision and thank every coach"]],acts:["Complete the FAFSA as soon as it opens in the fall.","Compare the net cost of every offer.","Rank your top five factors in your Tracker.","Review any written offer with your family and counselor.","Thank every coach who recruited you once you commit."],reflect:"Which option best fits the purpose you wrote in Step 3?"},{n:13,level:7,title:"Prepare for the Transition",smart:"Resilient",tool:null,purpose:"Finish strong and arrive ready, in the classroom, on the team and on campus.",why:"The first year is where many student-athletes struggle. Preparing now protects your eligibility, your grades and your wellbeing.",learn:["Lesson 13","Transition Tool Kit"],also:"In NCAA Division I and II, your five-year eligibility clock starts when you enroll full time, and it keeps running.",ms:[["CRR-L7-S13-M1","Send final transcript and proof of graduation"],["CRR-L7-S13-M2","Confirm eligibility, aid and housing"],["CRR-L7-S13-M3","Complete your exit reflection"]],acts:["Request your final transcript and proof of graduation.","Confirm your eligibility and aid with each office.","Get your summer training plan from your new coach.","Attend orientation and register for classes.","Complete your exit reflection in your Tracker."],reflect:"What did this journey teach you about yourself?"}],dl=[{id:"H1",name:"Be Informed & Organized",about:"Know the rules, track every detail and stay ahead of deadlines.",q:"Is my Tracker up to date?"},{id:"H2",name:"Be Realistic & Resilient",about:"Know your level, accept honest feedback and bounce back from setbacks.",q:"How did I handle my last setback?"},{id:"H3",name:"Prioritize Health & Wellness",about:"Take care of your body, your mind and who you are beyond your sport.",q:"Am I sleeping well and feeling okay?"}],Od=["Not Yet","Getting Started","Building","Confident"],$d=["Baseball","Basketball","Beach Volleyball","Bowling","Cross Country","Diving","Equestrian","Fencing","Field Hockey","Flag Football","Football","Golf","Gymnastics","Ice Hockey","Lacrosse","Rifle
